services:
  - type: web
    name: ai-productivity-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        value: sqlite:////mnt/data/todos.db
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: sqlite-data
      mountPath: /mnt/data
      sizeGB: 1
