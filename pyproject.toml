[tool.poetry]
name = "ai-productivity-assistant"
version = "0.1.0"
description = "AI Productivity Assistant with FastAPI and Next.js"
authors = ["Ayush Mishra"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.100.0"
uvicorn = {version = "0.23.0", extras = ["standard"]}
groq = "0.4.1"
sqlalchemy = "2.0.35"
pydantic = "2.7.0"
pydantic-settings = "2.5.0"
python-dotenv = "1.0.1"
email-validator = "2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
